<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Lift">
<title>Lift</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root {
  --red:#e84545; --red-dark:#c23636;
  --bg:#111111; --surface:#1c1c1e; --card:#242424; --card2:#2c2c2e;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
  --text:#ffffff; --text2:#ababab; --text3:#666666;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;color:var(--text);overscroll-behavior:none;}
#app{display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available;max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden;}
.statusbar{background:var(--bg);padding:calc(var(--safe-top) + 8px) 20px 6px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.statusbar .time{font-size:15px;font-weight:600;}
.statusbar .brand{font-size:15px;font-weight:700;color:var(--red);letter-spacing:2px;}
.statusbar .signal{font-size:11px;color:var(--text2);}
.prog-bar{background:var(--surface);border-bottom:0.5px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.prog-selector{flex:1;background:var(--card);border:0.5px solid var(--border2);border-radius:10px;color:var(--text);font-size:14px;font-weight:500;padding:8px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-width:0;}
.prog-selector span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prog-selector i{font-size:16px;color:var(--text3);flex-shrink:0;margin-left:6px;}
.prog-manage-btn{background:none;border:0.5px solid var(--border2);border-radius:10px;color:var(--text2);font-size:13px;font-weight:500;padding:8px 12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;flex-shrink:0;}
.prog-manage-btn i{font-size:15px;}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg);}
.page{display:none;flex-direction:column;padding-bottom:20px;}
.page.active{display:flex;}
.topbar{background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:5;}
.topbar h1{font-size:20px;font-weight:700;}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--red);font-size:22px;padding:4px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.back-btn{background:none;border:none;cursor:pointer;color:var(--red);font-size:15px;font-weight:500;padding:4px 0;display:flex;align-items:center;gap:4px;}
.back-btn i{font-size:20px;}
.day-tabs{display:flex;gap:6px;background:var(--bg);padding:8px 12px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:0.5px solid var(--border);}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{background:var(--card);border:none;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;padding:7px 16px;border-radius:20px;white-space:nowrap;transition:all .15s;}
.day-tab.active{background:var(--red);color:#fff;}
.ex-card{background:var(--card);margin:10px 12px 0;border-radius:16px;overflow:hidden;border:0.5px solid var(--border);}
.ex-header{padding:13px 14px 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--border);}
.ex-header-left{display:flex;align-items:center;gap:10px;}
.ex-num{color:var(--red);font-size:13px;font-weight:700;min-width:20px;}
.ex-name{font-size:15px;font-weight:600;line-height:1.3;}
.ex-muscle{font-size:12px;color:var(--text3);margin-top:1px;}
.ex-btns{display:flex;gap:4px;}
.ex-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:5px;border-radius:8px;display:flex;align-items:center;transition:color .15s;}
.ex-btn:active{color:var(--red);}
.sets-area{padding:10px 14px 12px;}
.sets-head{display:grid;grid-template-columns:32px 1fr 1fr 38px;gap:6px;padding-bottom:6px;}
.sets-head span{font-size:11px;color:var(--text3);text-align:center;font-weight:500;text-transform:uppercase;letter-spacing:.04em;}
.sets-head span:first-child{text-align:left;}
.set-row{display:grid;grid-template-columns:32px 1fr 1fr 38px;gap:6px;align-items:center;padding:5px 0;border-top:0.5px solid var(--border);}
.set-label{font-size:13px;color:var(--text3);font-weight:500;}
.set-inp{background:var(--card2);border:0.5px solid var(--border2);border-radius:9px;color:var(--text);font-size:14px;text-align:center;padding:7px 4px;width:100%;-webkit-appearance:none;}
.set-inp:focus{outline:none;border-color:var(--red);}
.set-done{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;margin:0 auto;transition:all .15s;}
.set-done.checked{background:var(--red);border-color:var(--red);color:#fff;}
.set-done i{font-size:14px;}
.set-actions{display:flex;gap:6px;padding-top:8px;}
.set-actions button{flex:1;background:var(--card2);border:0.5px solid var(--border);border-radius:10px;color:var(--text2);font-size:13px;font-weight:500;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
.set-actions button i{font-size:15px;}
.add-ex-btn{margin:14px 12px 0;background:var(--red);border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:600;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.add-ex-btn:active{background:var(--red-dark);}
.add-ex-btn i{font-size:19px;}
.empty-state{padding:60px 20px;text-align:center;color:var(--text3);font-size:14px;line-height:1.6;}
.empty-state i{font-size:44px;display:block;margin-bottom:12px;color:var(--border2);}
.lib-sticky{background:var(--bg);position:sticky;top:57px;z-index:4;border-bottom:0.5px solid var(--border);}
.lib-search-wrap{padding:10px 12px 6px;}
.lib-search{width:100%;background:var(--card);border:0.5px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;padding:10px 14px;-webkit-appearance:none;}
.lib-search::placeholder{color:var(--text3);}
.lib-search:focus{outline:none;border-color:var(--red);}
.muscle-pills{display:flex;gap:6px;padding:6px 12px 10px;overflow-x:auto;scrollbar-width:none;}
.muscle-pills::-webkit-scrollbar{display:none;}
.pill{background:var(--card);border:0.5px solid var(--border);border-radius:20px;color:var(--text2);font-size:12px;font-weight:500;padding:6px 14px;cursor:pointer;white-space:nowrap;transition:all .15s;}
.pill.active{background:var(--red);border-color:var(--red);color:#fff;}
.cat-section{margin:10px 12px 0;}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--card);border-radius:13px;cursor:pointer;border:0.5px solid var(--border);}
.cat-header.open{border-radius:13px 13px 0 0;}
.cat-header-left{display:flex;align-items:center;gap:10px;}
.cat-dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex-shrink:0;}
.cat-name{font-size:15px;font-weight:600;}
.cat-count{font-size:12px;color:var(--text3);margin-left:2px;}
.cat-chevron{color:var(--text3);font-size:18px;transition:transform .2s;}
.cat-chevron.open{transform:rotate(180deg);}
.cat-body{background:var(--card);border:0.5px solid var(--border);border-top:none;border-radius:0 0 13px 13px;overflow:hidden;display:none;}
.cat-body.open{display:block;}
.cat-ex-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-top:0.5px solid var(--border);}
.cat-ex-name{font-size:14px;font-weight:500;flex:1;padding-right:8px;}
.cat-ex-row-btns{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.cat-add-btn{background:var(--red);border:none;border-radius:8px;color:#fff;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.cat-add-btn:active{background:var(--red-dark);}
.cat-add-btn i{font-size:15px;}
.cat-del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:17px;padding:4px;display:flex;align-items:center;}
.cat-del-btn:active{color:var(--red);}
.cat-add-row{padding:10px 14px;display:flex;gap:8px;border-top:0.5px solid var(--border);background:var(--card2);}
.cat-add-inp{flex:1;background:var(--card);border:0.5px solid var(--border2);border-radius:10px;color:var(--text);font-size:14px;padding:9px 12px;-webkit-appearance:none;}
.cat-add-inp::placeholder{color:var(--text3);}
.cat-add-inp:focus{outline:none;border-color:var(--red);}
.cat-add-inp-btn{background:var(--red);border:none;border-radius:10px;color:#fff;cursor:pointer;padding:9px 16px;font-size:13px;font-weight:600;white-space:nowrap;}
.cat-add-inp-btn:active{background:var(--red-dark);}
.hist-item{background:var(--card);margin:10px 12px 0;border-radius:16px;padding:14px;border:0.5px solid var(--border);}
.hist-item h3{font-size:16px;font-weight:600;}
.hist-date{font-size:12px;color:var(--text3);margin-top:2px;}
.hist-stats{display:flex;gap:8px;margin-top:12px;}
.hist-stat{flex:1;background:var(--card2);border-radius:10px;padding:10px 8px;text-align:center;}
.hist-stat .val{color:var(--red);font-size:18px;font-weight:700;display:block;}
.hist-stat .lbl{color:var(--text3);font-size:11px;margin-top:2px;}
.navbar{background:var(--surface);border-top:0.5px solid var(--border);padding:8px 0 calc(var(--safe-bot) + 8px);display:flex;justify-content:space-around;flex-shrink:0;}
.nav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 20px;color:var(--text3);transition:color .15s;}
.nav-btn.active{color:var(--red);}
.nav-btn i{font-size:22px;}
.nav-btn span{font-size:10px;font-weight:500;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:20;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;padding:20px 16px calc(var(--safe-bot) + 24px);width:100%;max-width:430px;border-top:0.5px solid var(--border2);max-height:90vh;overflow-y:auto;}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}
.sheet h2{font-size:18px;font-weight:700;margin-bottom:16px;}
.sheet label{font-size:13px;color:var(--text2);display:block;margin:14px 0 5px;}
.sheet input,.sheet select{width:100%;background:var(--card);border:0.5px solid var(--border2);border-radius:12px;color:var(--text);font-size:15px;padding:11px 14px;-webkit-appearance:none;}
.sheet input:focus,.sheet select:focus{outline:none;border-color:var(--red);}
.sheet select option{background:var(--card);}
.sheet-btns{display:flex;gap:10px;margin-top:20px;}
.sheet-btns button{flex:1;padding:14px;border-radius:13px;border:none;font-size:16px;font-weight:600;cursor:pointer;}
.btn-cancel{background:var(--card);color:var(--text2);}
.btn-save{background:var(--red);color:#fff;}
.prog-item{background:var(--card);border-radius:12px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;border:0.5px solid var(--border);}
.prog-item.active-prog{border-color:var(--red);}
.prog-item-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
.prog-item-dot{width:8px;height:8px;border-radius:50%;background:var(--border2);flex-shrink:0;}
.prog-item-dot.active{background:var(--red);}
.prog-item-name{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prog-item-count{font-size:12px;color:var(--text3);margin-top:1px;}
.prog-item-btns{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.prog-item-btns button{background:none;border:none;cursor:pointer;font-size:18px;color:var(--text3);padding:3px;}
.prog-item-btns button:active{color:var(--red);}
.prog-select-btn{background:var(--red);border:none;border-radius:9px;color:#fff;cursor:pointer;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap;}
.prog-select-btn.current{background:var(--card2);color:var(--text3);cursor:default;}
.day-list-item{background:var(--card);border-radius:12px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;border:0.5px solid var(--border);}
.day-list-item span{font-size:15px;font-weight:500;}
.day-list-item-btns{display:flex;gap:10px;}
.day-list-item-btns button{background:none;border:none;cursor:pointer;font-size:18px;color:var(--text3);padding:2px;}
.day-list-item-btns button:active{color:var(--red);}
.add-day-btn{background:var(--card2);border:0.5px dashed var(--border2);border-radius:12px;color:var(--text3);font-size:15px;font-weight:500;padding:14px;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.add-prog-btn{background:var(--card2);border:0.5px dashed var(--border2);border-radius:12px;color:var(--text3);font-size:15px;font-weight:500;padding:14px;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;}
.toast{position:fixed;top:calc(var(--safe-top) + 60px);left:50%;transform:translateX(-50%) translateY(-10px);background:var(--red);color:#fff;font-size:14px;font-weight:500;padding:9px 18px;border-radius:30px;opacity:0;transition:all .25s;z-index:100;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <div class="statusbar">
    <span class="time" id="clock">9:41</span>
    <span class="brand">LIFT</span>
    <span class="signal">●●●</span>
  </div>

  <div class="prog-bar">
    <div class="prog-selector" onclick="openSheet('sheet-programs')">
      <span id="prog-bar-name">Level 1</span>
      <i class="ti ti-chevron-down"></i>
    </div>
    <button class="prog-manage-btn" onclick="openSheet('sheet-days')" aria-label="Manage days">
      <i class="ti ti-layout-columns"></i> Days
    </button>
  </div>

  <div class="content" id="content">

    <div class="page active" id="page-workout">
      <div class="day-tabs" id="day-tabs"></div>
      <div id="ex-list"></div>
      <button class="add-ex-btn" onclick="showPage('page-library')">
        <i class="ti ti-plus"></i> Add exercise
      </button>
      <div style="height:16px;"></div>
    </div>

    <div class="page" id="page-library">
      <div class="topbar">
        <button class="back-btn" onclick="showPage('page-workout')"><i class="ti ti-chevron-left"></i> Back</button>
        <h1>Library</h1>
        <div style="width:60px;"></div>
      </div>
      <div class="lib-sticky">
        <div class="lib-search-wrap">
          <input class="lib-search" type="search" placeholder="Search exercises..." id="lib-search-inp" oninput="renderLib()">
        </div>
        <div class="muscle-pills" id="muscle-pills"></div>
      </div>
      <div id="lib-cats"></div>
      <div style="height:24px;"></div>
    </div>

    <div class="page" id="page-history">
      <div class="topbar"><h1>History</h1></div>
      <div id="hist-list"></div>
    </div>

  </div>

  <nav class="navbar">
    <button class="nav-btn active" id="nav-workout" onclick="showPage('page-workout')">
      <i class="ti ti-barbell"></i><span>Workout</span>
    </button>
    <button class="nav-btn" id="nav-library" onclick="showPage('page-library')">
      <i class="ti ti-books"></i><span>Library</span>
    </button>
    <button class="nav-btn" id="nav-history" onclick="showPage('page-history')">
      <i class="ti ti-chart-bar"></i><span>History</span>
    </button>
  </nav>
</div>

<!-- Programs sheet -->
<div class="overlay" id="sheet-programs" onclick="handleOverlayClick(event,'sheet-programs')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Programs</h2>
    <div id="prog-list"></div>
    <button class="add-prog-btn" onclick="addProgram()"><i class="ti ti-plus"></i> New program</button>
    <div class="sheet-btns" style="margin-top:16px;">
      <button class="btn-save" onclick="closeSheet('sheet-programs')">Done</button>
    </div>
  </div>
</div>

<!-- Rename program sheet -->
<div class="overlay" id="sheet-rename-prog" onclick="handleOverlayClick(event,'sheet-rename-prog')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Rename program</h2>
    <label>Program name</label>
    <input type="text" id="rename-prog-inp" placeholder="e.g. Hypertrophy block">
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="backToPrograms()">Cancel</button>
      <button class="btn-save" onclick="saveRenameProgram()">Save</button>
    </div>
  </div>
</div>

<!-- Manage days sheet -->
<div class="overlay" id="sheet-days" onclick="handleOverlayClick(event,'sheet-days')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Manage days</h2>
    <div id="day-list-modal"></div>
    <button class="add-day-btn" onclick="addDay()"><i class="ti ti-plus"></i> Add day</button>
    <div class="sheet-btns" style="margin-top:16px;">
      <button class="btn-save" onclick="closeSheet('sheet-days')">Done</button>
    </div>
  </div>
</div>

<!-- Rename day sheet -->
<div class="overlay" id="sheet-rename-day" onclick="handleOverlayClick(event,'sheet-rename-day')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Rename day</h2>
    <label>Day name</label>
    <input type="text" id="rename-day-inp" placeholder="e.g. Monday">
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="backToDays()">Cancel</button>
      <button class="btn-save" onclick="saveRenameDay()">Save</button>
    </div>
  </div>
</div>

<!-- Edit exercise sheet -->
<div class="overlay" id="sheet-edit" onclick="handleOverlayClick(event,'sheet-edit')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Edit exercise</h2>
    <label>Exercise name</label>
    <input type="text" id="edit-name" placeholder="e.g. Heel raises">
    <label>Muscle group</label>
    <select id="edit-muscle">
      <option>Calf</option><option>Quad</option><option>Hamstring</option><option>Glute</option>
      <option>Shoulder</option><option>Chest</option><option>Back</option>
      <option>Biceps</option><option>Triceps</option><option>Core</option><option>Rehab</option>
    </select>
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="closeSheet('sheet-edit')">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = ['Calf','Quad','Hamstring','Glute','Shoulder','Chest','Back','Biceps','Triceps','Core','Rehab'];

const DEFAULT_LIBRARY = {
  'Calf':['Heel raises','Tibialis raises','Calf press','Standing calf raise','Seated calf raise','Standing heel raise','Toe raise with back against wall'],
  'Quad':['Split squat','Leg press','Hack squat','Front squat','Leg extension','Bulgarian split squat','Supine quad set','Seated quad set','Active straight leg raise with quad set','Wall squat','Squat with chair touch'],
  'Hamstring':['Romanian deadlift','Leg curl','Nordic curl','Good morning','Stiff-leg deadlift','Supine hamstring stretch with strap'],
  'Glute':['GHD','Jefferson curls','Hip thrust','Glute bridge','Cable kickback','Sumo deadlift','Single leg bridge','Supine bridge'],
  'Shoulder':['Dumbbell ER','Powell raises','Lateral raises','Overhead press','Arnold press','Face pulls','Rear delt fly'],
  'Chest':['Pushups','Bench press','Incline dumbbell press','Cable fly','Dips','Chest-supported fly'],
  'Back':['Ring rows','Cable row','Barbell row','Chest-supported row','Meadows row','Seal row','Pull-ups','Lat pulldown'],
  'Biceps':['Barbell curl','Hammer curl','Incline curl','Cable curl','Spider curl','Concentration curl'],
  'Triceps':['Tricep pushdown','Skull crushers','Overhead extension','Close-grip bench','Cable kickback'],
  'Core':['Ab wheel','Leg raises','Plank','Cable crunch','Pallof press','Dead bug','Hollow hold'],
  'Rehab':['Supine knee extension stretch on towel roll','Supine single leg ankle pumps','Supine hamstring stretch with strap','Supine quad set','Active straight leg raise with quad set','Seated knee extension stretch with chair','Seated quad set','Supine heel slide with strap','Supine bridge','Supine knee extension strengthening','Seated knee flexion stretch','Seated heel toe raises','Sit to stand','Forward step up','Single leg bridge','Standing heel raise','Toe raise with back against wall','Wall squat','Squat with chair touch','Reverse lunge'],
};

function s1() { return {w:'0',r:'',done:false}; }

function makeDayProg(exercises) {
  // exercises = array of {name, muscle}
  return exercises.map(e => ({name:e.name, muscle:e.muscle, sets:[s1()]}));
}

function makeLevel1() {
  const exercises = [
    {name:'Supine knee extension stretch on towel roll', muscle:'Rehab'},
    {name:'Supine single leg ankle pumps', muscle:'Rehab'},
    {name:'Supine hamstring stretch with strap', muscle:'Rehab'},
    {name:'Supine quad set', muscle:'Rehab'},
    {name:'Active straight leg raise with quad set', muscle:'Rehab'},
    {name:'Seated knee extension stretch with chair', muscle:'Rehab'},
    {name:'Seated quad set', muscle:'Rehab'},
  ];
  const days = ['Day 1','Day 2','Day 3','Day 4','Day 5','Day 6'];
  const program = {};
  days.forEach(d => { program[d] = makeDayProg(exercises); });
  return {name:'Level 1', days, program};
}

function makeLevel2() {
  const exercises = [
    {name:'Supine heel slide with strap', muscle:'Rehab'},
    {name:'Supine bridge', muscle:'Rehab'},
    {name:'Supine knee extension strengthening', muscle:'Rehab'},
    {name:'Seated knee flexion stretch', muscle:'Rehab'},
    {name:'Seated heel toe raises', muscle:'Rehab'},
    {name:'Sit to stand', muscle:'Rehab'},
    {name:'Forward step up', muscle:'Rehab'},
  ];
  const days = ['Day 1','Day 2','Day 3','Day 4','Day 5','Day 6'];
  const program = {};
  days.forEach(d => { program[d] = makeDayProg(exercises); });
  return {name:'Level 2', days, program};
}

function makeLevel3() {
  const exercises = [
    {name:'Single leg bridge', muscle:'Rehab'},
    {name:'Standing heel raise', muscle:'Rehab'},
    {name:'Toe raise with back against wall', muscle:'Rehab'},
    {name:'Wall squat', muscle:'Rehab'},
    {name:'Squat with chair touch', muscle:'Rehab'},
    {name:'Reverse lunge', muscle:'Rehab'},
  ];
  const days = ['Day 1','Day 2','Day 3'];
  const program = {};
  days.forEach(d => { program[d] = makeDayProg(exercises); });
  return {name:'Level 3', days, program};
}

const KEY = 'lift_v4';
let state = load();
let activeProg = state.activeProgram || 0;
let activeDayIdx = 0;
let libFilter = 'All';
let openCats = new Set(CATEGORIES);
let editingDay = null;
let editingExIdx = null;
let renamingDayIdx = null;
let renamingProgIdx = null;

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const p = JSON.parse(s);
      if (!p.library) p.library = JSON.parse(JSON.stringify(DEFAULT_LIBRARY));
      if (!p.programs || !p.programs.length) {
        p.programs = [makeLevel1(), makeLevel2(), makeLevel3()];
        p.activeProgram = 0;
      }
      // Ensure Rehab category exists in library
      if (!p.library['Rehab']) p.library['Rehab'] = DEFAULT_LIBRARY['Rehab'];
      return p;
    }
  } catch(e) {}
  return {
    programs: [makeLevel1(), makeLevel2(), makeLevel3()],
    activeProgram: 0,
    library: JSON.parse(JSON.stringify(DEFAULT_LIBRARY)),
    history: []
  };
}

function save() {
  state.activeProgram = activeProg;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
}

function prog() { return state.programs[activeProg]; }
function curDay() { return prog().days[activeDayIdx]; }
function curExercises() { return prog().program[curDay()] || []; }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escA(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  ['workout','library','history'].forEach(n => document.getElementById('nav-'+n).classList.remove('active'));
  const map = {'page-workout':'workout','page-library':'library','page-history':'history'};
  if (map[id]) document.getElementById('nav-'+map[id]).classList.add('active');
  if (id === 'page-library') renderLib();
  if (id === 'page-history') renderHistory();
  document.getElementById('content').scrollTop = 0;
}

function openSheet(id) {
  document.getElementById(id).classList.add('open');
  if (id === 'sheet-days') renderDayModal();
  if (id === 'sheet-programs') renderProgList();
}
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
function handleOverlayClick(e, id) { if (e.target === document.getElementById(id)) closeSheet(id); }

/* PROGRAMS */
function renderProgBar() {
  document.getElementById('prog-bar-name').textContent = prog().name;
}

function renderProgList() {
  document.getElementById('prog-list').innerHTML = state.programs.map((p,i) => {
    const exTotal = p.days.reduce((a,d) => a + (p.program[d]||[]).length, 0);
    const isCur = i === activeProg;
    return `
    <div class="prog-item ${isCur?'active-prog':''}">
      <div class="prog-item-left">
        <div class="prog-item-dot ${isCur?'active':''}"></div>
        <div>
          <div class="prog-item-name">${esc(p.name)}</div>
          <div class="prog-item-count">${p.days.length} days · ${exTotal} exercises</div>
        </div>
      </div>
      <div class="prog-item-btns">
        <button onclick="openRenameProgram(${i})" aria-label="Rename"><i class="ti ti-edit"></i></button>
        <button onclick="deleteProgram(${i})" ${state.programs.length<=1?'style="opacity:.3;pointer-events:none;"':''} aria-label="Delete"><i class="ti ti-trash"></i></button>
        <button class="prog-select-btn ${isCur?'current':''}" onclick="${isCur?'':'selectProgram('+i+')'}">${isCur?'Active':'Switch'}</button>
      </div>
    </div>`;
  }).join('');
}

function selectProgram(i) {
  activeProg = i; activeDayIdx = 0; save();
  renderProgBar(); renderProgList(); renderDayTabs(); renderWorkout();
}

function addProgram() {
  const name = 'Program ' + (state.programs.length + 1);
  const p = {name, days:['Day 1'], program:{'Day 1':[]}};
  state.programs.push(p); save(); renderProgList(); toast('Program added');
}

function openRenameProgram(i) {
  renamingProgIdx = i;
  document.getElementById('rename-prog-inp').value = state.programs[i].name;
  closeSheet('sheet-programs');
  setTimeout(() => openSheet('sheet-rename-prog'), 50);
}
function saveRenameProgram() {
  const name = document.getElementById('rename-prog-inp').value.trim();
  if (!name) return;
  state.programs[renamingProgIdx].name = name;
  save(); closeSheet('sheet-rename-prog'); renderProgBar();
  setTimeout(() => openSheet('sheet-programs'), 50);
}
function backToPrograms() {
  closeSheet('sheet-rename-prog');
  setTimeout(() => openSheet('sheet-programs'), 50);
}
function deleteProgram(i) {
  if (state.programs.length <= 1) return;
  if (!confirm('Delete "' + state.programs[i].name + '"?')) return;
  state.programs.splice(i,1);
  if (activeProg >= state.programs.length) activeProg = state.programs.length-1;
  activeDayIdx = 0; save();
  renderProgBar(); renderProgList(); renderDayTabs(); renderWorkout();
}

/* WORKOUT */
function renderDayTabs() {
  document.getElementById('day-tabs').innerHTML = prog().days.map((d,i) =>
    `<button class="day-tab ${i===activeDayIdx?'active':''}" onclick="setDay(${i})">${esc(d)}</button>`
  ).join('');
}
function setDay(i) { activeDayIdx = i; renderDayTabs(); renderWorkout(); }

function renderWorkout() {
  const exs = curExercises();
  const day = curDay();
  const el = document.getElementById('ex-list');
  if (!exs.length) {
    el.innerHTML = `<div class="empty-state"><i class="ti ti-barbell"></i>No exercises yet.<br>Tap "Add exercise" to get started.</div>`;
    return;
  }
  el.innerHTML = exs.map((ex, ei) => {
    const sets = ex.sets.map((s, si) => `
      <div class="set-row">
        <span class="set-label">${si+1}</span>
        <input class="set-inp" type="number" inputmode="decimal" placeholder="lbs" value="${esc(s.w)}"
          onchange="setField(${activeProg},'${escA(day)}',${ei},${si},'w',this.value)">
        <input class="set-inp" type="number" inputmode="numeric" placeholder="reps" value="${esc(s.r)}"
          onchange="setField(${activeProg},'${escA(day)}',${ei},${si},'r',this.value)">
        <button class="set-done ${s.done?'checked':''}" onclick="toggleDone(${activeProg},'${escA(day)}',${ei},${si})" aria-label="Done">
          <i class="ti ti-check"></i>
        </button>
      </div>`).join('');
    return `
    <div class="ex-card">
      <div class="ex-header">
        <div class="ex-header-left">
          <span class="ex-num">${ei+1}</span>
          <div>
            <div class="ex-name">${esc(ex.name)}</div>
            <div class="ex-muscle">${esc(ex.muscle)}</div>
          </div>
        </div>
        <div class="ex-btns">
          <button class="ex-btn" onclick="openEdit(${activeProg},'${escA(day)}',${ei})" aria-label="Edit"><i class="ti ti-edit"></i></button>
          <button class="ex-btn" onclick="deleteEx(${activeProg},'${escA(day)}',${ei})" aria-label="Delete"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      <div class="sets-area">
        <div class="sets-head"><span>Set</span><span>Weight</span><span>Reps</span><span></span></div>
        ${sets}
        <div class="set-actions">
          <button onclick="addSet(${activeProg},'${escA(day)}',${ei})"><i class="ti ti-plus"></i> Add set</button>
          <button onclick="removeSet(${activeProg},'${escA(day)}',${ei})" ${ex.sets.length<=1?'style="opacity:.35;"':''}><i class="ti ti-minus"></i> Remove</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function setField(pi,day,ei,si,field,val) {
  state.programs[pi].program[day][ei].sets[si][field]=val; save();
}
function toggleDone(pi,day,ei,si) {
  state.programs[pi].program[day][ei].sets[si].done=!state.programs[pi].program[day][ei].sets[si].done;
  save(); renderWorkout();
}
function addSet(pi,day,ei) {
  state.programs[pi].program[day][ei].sets.push({w:'0',r:'',done:false}); save(); renderWorkout();
}
function removeSet(pi,day,ei) {
  if(state.programs[pi].program[day][ei].sets.length<=1) return;
  state.programs[pi].program[day][ei].sets.pop(); save(); renderWorkout();
}
function deleteEx(pi,day,ei) {
  if(!confirm('Remove '+state.programs[pi].program[day][ei].name+'?')) return;
  state.programs[pi].program[day].splice(ei,1); save(); renderWorkout();
}
function openEdit(pi,day,ei) {
  editingDay=day; editingExIdx=ei;
  const ex=state.programs[pi].program[day][ei];
  document.getElementById('edit-name').value=ex.name;
  document.getElementById('edit-muscle').value=ex.muscle;
  openSheet('sheet-edit');
}
function saveEdit() {
  const name=document.getElementById('edit-name').value.trim();
  const muscle=document.getElementById('edit-muscle').value;
  if(!name) return;
  state.programs[activeProg].program[editingDay][editingExIdx].name=name;
  state.programs[activeProg].program[editingDay][editingExIdx].muscle=muscle;
  save(); closeSheet('sheet-edit'); renderWorkout();
}

/* DAYS */
function renderDayModal() {
  document.getElementById('day-list-modal').innerHTML = prog().days.map((d,i) => `
    <div class="day-list-item">
      <span>${esc(d)}</span>
      <div class="day-list-item-btns">
        <button onclick="openRenameDay(${i})" aria-label="Rename"><i class="ti ti-edit"></i></button>
        <button onclick="deleteDay(${i})" ${prog().days.length<=1?'style="opacity:.3;pointer-events:none;"':''} aria-label="Delete"><i class="ti ti-trash"></i></button>
      </div>
    </div>`).join('');
}
function addDay() {
  const p=prog(); const name='Day '+(p.days.length+1);
  p.days.push(name); p.program[name]=[];
  save(); renderDayModal(); renderDayTabs();
}
function deleteDay(i) {
  const p=prog();
  if(p.days.length<=1) return;
  if(!confirm('Delete '+p.days[i]+'?')) return;
  const name=p.days[i]; p.days.splice(i,1); delete p.program[name];
  if(activeDayIdx>=p.days.length) activeDayIdx=p.days.length-1;
  save(); renderDayModal(); renderDayTabs(); renderWorkout();
}
function openRenameDay(i) {
  renamingDayIdx=i;
  document.getElementById('rename-day-inp').value=prog().days[i];
  closeSheet('sheet-days');
  setTimeout(()=>openSheet('sheet-rename-day'),50);
}
function saveRenameDay() {
  const name=document.getElementById('rename-day-inp').value.trim();
  if(!name) return;
  const p=prog(); const old=p.days[renamingDayIdx];
  p.days[renamingDayIdx]=name; p.program[name]=p.program[old]||[]; delete p.program[old];
  save(); closeSheet('sheet-rename-day');
  setTimeout(()=>openSheet('sheet-days'),50);
  renderDayTabs(); renderWorkout();
}
function backToDays() {
  closeSheet('sheet-rename-day');
  setTimeout(()=>openSheet('sheet-days'),50);
}

/* LIBRARY */
function toggleCat(cat) {
  if(openCats.has(cat)) openCats.delete(cat); else openCats.add(cat);
  renderLib();
}
function renderLib() {
  const q=document.getElementById('lib-search-inp').value.toLowerCase().trim();
  const allCats=['All',...CATEGORIES];
  document.getElementById('muscle-pills').innerHTML=allCats.map(m=>
    `<button class="pill ${m===libFilter?'active':''}" onclick="setLibFilter('${m}')">${m}</button>`
  ).join('');
  const cats=libFilter==='All'?CATEGORIES:[libFilter];
  let html='';
  cats.forEach(cat=>{
    let exercises=(state.library[cat]||[]);
    if(q) exercises=exercises.filter(n=>n.toLowerCase().includes(q));
    if(q&&!exercises.length) return;
    const isOpen=openCats.has(cat)||q.length>0;
    const sc=escA(cat);
    const rows=exercises.map((name,ni)=>`
      <div class="cat-ex-row">
        <span class="cat-ex-name">${esc(name)}</span>
        <div class="cat-ex-row-btns">
          <button class="cat-del-btn" onclick="deleteLibEx('${sc}',${ni})" aria-label="Delete"><i class="ti ti-trash"></i></button>
          <button class="cat-add-btn" onclick="addFromLib('${escA(name)}','${sc}')" aria-label="Add">
            <i class="ti ti-plus"></i>
          </button>
        </div>
      </div>`).join('');
    html+=`
    <div class="cat-section">
      <div class="cat-header ${isOpen?'open':''}" onclick="toggleCat('${sc}')">
        <div class="cat-header-left">
          <div class="cat-dot"></div>
          <span class="cat-name">${esc(cat)}</span>
          <span class="cat-count">${(state.library[cat]||[]).length} exercise${(state.library[cat]||[]).length!==1?'s':''}</span>
        </div>
        <i class="ti ti-chevron-down cat-chevron ${isOpen?'open':''}"></i>
      </div>
      <div class="cat-body ${isOpen?'open':''}">
        ${rows}
        <div class="cat-add-row">
          <input class="cat-add-inp" type="text" id="inp-${esc(cat)}" placeholder="Add new exercise..."
            onkeydown="if(event.key==='Enter')addLibEx('${sc}')">
          <button class="cat-add-inp-btn" onclick="addLibEx('${sc}')">Add</button>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('lib-cats').innerHTML=html||'<div class="empty-state"><i class="ti ti-search"></i>No exercises found.</div>';
}
function setLibFilter(m){libFilter=m;renderLib();}
function addLibEx(cat){
  const inp=document.getElementById('inp-'+cat);
  if(!inp) return;
  const name=inp.value.trim();
  if(!name) return;
  if(!state.library[cat]) state.library[cat]=[];
  if(state.library[cat].map(n=>n.toLowerCase()).includes(name.toLowerCase())){toast('Already in library');return;}
  state.library[cat].push(name); save(); inp.value=''; renderLib();
  toast(name+' added to '+cat);
}
function deleteLibEx(cat,ni){
  const name=(state.library[cat]||[])[ni];
  if(!name) return;
  if(!confirm('Remove "'+name+'" from library?')) return;
  state.library[cat].splice(ni,1); save(); renderLib();
}
function addFromLib(name,muscle){
  const day=curDay(); const p=prog();
  if(!p.program[day]) p.program[day]=[];
  const alreadyInThisDay=p.program[day].filter(e=>e.name===name).length>0;
  if(alreadyInThisDay){if(!confirm(name+' is already in '+day+'. Add another?')) return;}
  p.program[day].push({name,muscle,sets:[{w:'0',r:'',done:false}]});
  save(); renderLib(); toast(name+' \u2192 '+day);
}

/* HISTORY */
function renderHistory(){
  const p=prog();
  const items=p.days.map(d=>{
    const exs=p.program[d]||[];
    const totalSets=exs.reduce((a,e)=>a+e.sets.length,0);
    const doneSets=exs.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
    return{day:d,exs:exs.length,totalSets,doneSets};
  }).filter(i=>i.exs>0);
  if(!items.length){
    document.getElementById('hist-list').innerHTML='<div class="empty-state"><i class="ti ti-chart-bar"></i>Add exercises to see your program summary here.</div>';
    return;
  }
  document.getElementById('hist-list').innerHTML=`
    <div style="padding:12px 12px 0;font-size:13px;color:var(--text3);">Program: <span style="color:var(--text2);font-weight:500;">${esc(prog().name)}</span></div>
    `+items.map(i=>`
    <div class="hist-item">
      <h3>${esc(i.day)}</h3>
      <div class="hist-date">${i.exs} exercise${i.exs!==1?'s':''}</div>
      <div class="hist-stats">
        <div class="hist-stat"><span class="val">${i.exs}</span><span class="lbl">Exercises</span></div>
        <div class="hist-stat"><span class="val">${i.totalSets}</span><span class="lbl">Total sets</span></div>
        <div class="hist-stat"><span class="val">${i.doneSets}</span><span class="lbl">Completed</span></div>
      </div>
    </div>`).join('');
}

/* CLOCK */
function updateClock(){
  const now=new Date();
  const h=now.getHours()%12||12;
  const m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent=h+':'+m;
}

updateClock();
setInterval(updateClock,10000);
renderProgBar();
renderDayTabs();
renderWorkout();
</script>
</body>
</html>
